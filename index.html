<title>CARTOS 카토스 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F4F5F7; --surface-3:#E9ECF0; --line:#E0E4E9; --line-2:#ECEEF2;
  --ink:#15191E; --ink-2:#2B323B; --sub:#5A636F; --faint:#7F8894;
  --accent:#A95A00; --accent-ink:#FFFFFF; --accent-bg:#FBEFDF; --accent-line:#EFCF9F; --accent-soft:#F6DDB8;
  --bar:#CF7F10; --bar-soft:#EBC58D;
  --ok:#1B7A4E; --ok-bg:#E4F3EA; --ok-line:#B2DBC3;
  --warn:#8F5600; --warn-bg:#FFF3DD; --warn-line:#F0D6A3;
  --bad:#B0362C; --bad-bg:#FBE8E5; --bad-line:#EDB9B2;
  --info:#2F6FB0; --info-bg:#E7F0FA;
  --steel:#8792A0;
  --cat1:#2a78d6; --cat2:#eb6834; --cat3:#1baf7a;
  --mapbg:#E4E8ED; --seq0:#F8F9FB; --seq1:#DCE9FA; --seq2:#B4D0F4; --seq3:#80B1EC; --seq4:#4589DC;
  --hero:#171B21; --hero-2:#222830; --hero-3:#2E353F; --hero-ink:#F2F3F5; --hero-sub:#A6AFBA; --hero-acc:#F4A73A;
  --scrim:rgba(14,17,20,.5);
  --shadow:0 1px 2px rgba(20,24,29,.04),0 4px 14px rgba(20,24,29,.05);
  --shadow-pop:0 14px 40px rgba(20,24,29,.22);
  --r:18px; --r-sm:12px;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-num:'Barlow Condensed','IBM Plex Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1013; --surface:#161A1F; --surface-2:#1C2127; --surface-3:#242A31; --line:#282F37; --line-2:#20262D;
    --ink:#ECEFF3; --ink-2:#D3D8DF; --sub:#A0AAB6; --faint:#7A8491;
    --accent:#F4A73A; --accent-ink:#1A1206; --accent-bg:#2C2110; --accent-line:#58411A; --accent-soft:#3E2E12;
    --bar:#E99A2C; --bar-soft:#6B5027;
    --ok:#4CC38A; --ok-bg:#11271C; --ok-line:#22523A;
    --warn:#F0B657; --warn-bg:#2D220F; --warn-line:#574218;
    --bad:#F08074; --bad-bg:#311715; --bad-line:#5E2F29;
    --info:#6EAAE6; --info-bg:#14212F;
    --steel:#7F8A99;
    --cat1:#3987e5; --cat2:#d95926; --cat3:#199e70;
    --mapbg:#101317; --seq0:#262C35; --seq1:#172638; --seq2:#1C3A60; --seq3:#285C96; --seq4:#3A86E0;
    --hero:#1A1F26; --hero-2:#232A33; --hero-3:#2E3640;
    --scrim:rgba(0,0,0,.64);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);
    --shadow-pop:0 14px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1013; --surface:#161A1F; --surface-2:#1C2127; --surface-3:#242A31; --line:#282F37; --line-2:#20262D;
  --ink:#ECEFF3; --ink-2:#D3D8DF; --sub:#A0AAB6; --faint:#7A8491;
  --accent:#F4A73A; --accent-ink:#1A1206; --accent-bg:#2C2110; --accent-line:#58411A; --accent-soft:#3E2E12;
  --bar:#E99A2C; --bar-soft:#6B5027;
  --ok:#4CC38A; --ok-bg:#11271C; --ok-line:#22523A;
  --warn:#F0B657; --warn-bg:#2D220F; --warn-line:#574218;
  --bad:#F08074; --bad-bg:#311715; --bad-line:#5E2F29;
  --info:#6EAAE6; --info-bg:#14212F;
  --steel:#7F8A99;
  --cat1:#3987e5; --cat2:#d95926; --cat3:#199e70;
  --mapbg:#101317; --seq0:#262C35; --seq1:#172638; --seq2:#1C3A60; --seq3:#285C96; --seq4:#3A86E0;
  --hero:#1A1F26; --hero-2:#232A33; --hero-3:#2E3640;
  --scrim:rgba(0,0,0,.64);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);
  --shadow-pop:0 14px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding-inline:16px;padding-block:9px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line-2)}
.brandrow{display:flex;align-items:center;gap:8px;min-height:30px}
.brand{display:flex;align-items:center;gap:7px;background:none;border:0;padding:0}
.brand .mk{width:22px;height:22px;flex:none}
.brand .wm{font-family:var(--f-num);font-weight:600;font-size:17px;letter-spacing:.16em;line-height:1}
.brand .ko{font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.02em}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.livepill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px 3px 7px;font-size:11.5px;font-weight:600;color:var(--sub)}
.tri{display:inline-flex;gap:3px}
.tri i{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:tri 2.4s ease-in-out infinite}
.tri i:nth-child(2){animation-delay:.3s;background:var(--info)}
.tri i:nth-child(3){animation-delay:.6s;background:var(--accent)}
@keyframes tri{0%,60%,100%{transform:scale(1);opacity:1}30%{transform:scale(1.55);opacity:.55}}
.thm{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--sub);display:grid;place-items:center;padding:0;flex:none}
.thm .ic{width:15px;height:15px}
.thm:active{transform:scale(.92)}
@media (max-width:400px){.brand .ko{display:none}.livepill{padding-inline:6px 8px}}
@media (max-width:372px){.lpx{display:none}.btn{font-size:13px;padding-inline:10px}.brand .wm{letter-spacing:.12em}}
.livepill,.btn{white-space:nowrap}
.demo{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--faint)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--surface-3);border-radius:11px;padding:3px}
.roles button{border:0;background:none;border-radius:8px;padding:6px 4px;font-size:13px;font-weight:500;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px}
.roles button .rd{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.roles button[aria-pressed="true"] .rd{opacity:1;background:var(--rc)}

main#view{flex:1;padding-inline:16px;padding-block:16px 176px;display:flex;flex-direction:column;gap:14px}
main#view.enter > *{animation:rise .38s cubic-bezier(.2,.8,.3,1) both}
main#view.enter > *:nth-child(2){animation-delay:.03s} main#view.enter > *:nth-child(3){animation-delay:.06s}
main#view.enter > *:nth-child(4){animation-delay:.09s} main#view.enter > *:nth-child(5){animation-delay:.12s}
main#view.enter > *:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11.5px;font-weight:500;letter-spacing:.08em;color:var(--faint)}
.ph{display:flex;flex-direction:column;gap:6px}
h1.h1{margin:0;font-size:22px;line-height:1.36;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.lead{margin:0;color:var(--sub);font-size:13.5px;line-height:1.65}
.who{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.who b{color:var(--ink);font-weight:600}
.dotsep{width:3px;height:3px;border-radius:50%;background:var(--faint)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card.tight{gap:8px}
.cardh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cardh h2{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.cardh .sub{font-size:11.5px;color:var(--faint);white-space:nowrap}
.hint{margin:0;font-size:12px;color:var(--faint);line-height:1.55}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.divider{height:1px;background:var(--line-2);margin-block:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:11px 14px;font-weight:600;font-size:14px;min-height:44px;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:none}
.btn.block{width:100%}
.btn .ic{width:16px;height:16px}
.btns{display:grid;grid-template-columns:1.35fr 1fr;gap:8px}
.tbtn{background:none;border:0;padding:4px 0;color:var(--sub);font-weight:500;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.tbtn:hover{color:var(--ink)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--sub);white-space:nowrap;line-height:1.6}
.chip.ok{color:var(--ok);background:var(--ok-bg)}
.chip.warn{color:var(--warn);background:var(--warn-bg)}
.chip.bad{color:var(--bad);background:var(--bad-bg)}
.chip.acc{color:var(--accent);background:var(--accent-bg)}
.chip.info{color:var(--info);background:var(--info-bg)}
.chip .ic{width:12px;height:12px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:var(--surface-3);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:7px;padding:6px 6px;font-size:12.5px;font-weight:500;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg .ic{width:14px;height:14px}

/* KPI */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:12px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .k{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:6px}
.kpi .k i{width:7px;height:7px;border-radius:2px;background:var(--kc,var(--line))}
.kpi .v{font-family:var(--f-num);font-weight:600;font-size:27px;line-height:1.08;font-variant-numeric:tabular-nums;letter-spacing:.005em}
.kpi .v small{font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--sub);margin-left:3px}
.kpi .d{font-size:11.5px;color:var(--faint)}

/* live */
.pulse{position:relative;width:8px;height:8px;border-radius:50%;background:var(--pc,var(--ok));flex:none;display:inline-block}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--pc,var(--ok));animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.1);opacity:0}}
.livebar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 13px;font-size:12.5px;color:var(--sub)}
.livebar b{color:var(--ink);font-weight:600}
.livebar .num{font-size:17px;font-weight:600;color:var(--ink)}
.feed{display:flex;flex-direction:column}
.fe{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.fe:last-child{border-bottom:0}
.fe .who2{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--sub)}
.fe .who2 .ic{width:14px;height:14px}
.fe b{font-weight:600}
.fe small{display:block;color:var(--faint);font-size:11px}
.fe .t{color:var(--faint);font-size:11px;white-space:nowrap}
.fe.new{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accent-bg)}100%{background:transparent}}

/* network */
.net{position:relative}
.net svg{width:100%;height:auto;display:block}
.net text{font-family:var(--f-ui)}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-ui);fill:var(--faint);font-size:10.5px}
.chart .gl{stroke:var(--line-2);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .tier{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:4 4}
.chart .tierl{fill:var(--accent);font-weight:600;font-size:10.5px}
.chart .vl{fill:var(--ink);font-family:var(--f-num);font-weight:600;font-size:14px}
.chart .ml{fill:var(--sub);font-size:11px}
.chart .ml.on{fill:var(--ink);font-weight:600}
.chart [data-tip]{cursor:pointer}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.8,.25,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.lgrow{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--sub)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.lg{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:8px;font-size:12.5px}
.lg .swb{width:10px;height:10px;border-radius:3px}
.lg .nm small{display:block;color:var(--faint);font-size:11px}
.lg .vv{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.lg .vv small{display:block;color:var(--faint);font-weight:500;font-size:11px}
.donutwrap{display:flex;align-items:center;gap:14px}
.donutwrap svg{width:124px;height:124px;flex:none}
.dseg{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.25,1)}

/* hbars */
.hb{display:flex;flex-direction:column;gap:7px}
.hbr{display:grid;grid-template-columns:76px 1fr 40px;align-items:center;gap:8px;font-size:12px}
.hbr .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbr .n.me{font-weight:600;color:var(--accent)}
.trk{position:relative;height:10px;background:var(--surface-2);border-radius:0 5px 5px 0}
.trk .f{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0;transition:width .9s cubic-bezier(.2,.8,.25,1)}
.trk .f.low{background:var(--bar-soft)}
.trk .th{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1.5px dashed var(--accent)}
.hbr .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hbnote{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub)}
.hbnote i{display:inline-block;width:0;height:12px;border-left:1.5px dashed var(--accent)}

/* items */
.items{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:1fr auto;gap:1px 10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.it:first-child{padding-top:2px}
.it .nm{font-weight:500;font-size:14px}
.it .meta{font-size:11.5px;color:var(--faint)}
.it .q{grid-row:span 2;align-self:center;font-family:var(--f-num);font-weight:600;font-size:21px}
.it .q small{font-family:var(--f-ui);font-size:11.5px;color:var(--sub);font-weight:500;margin-left:2px}
.sumline{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--sub)}
.sumline b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.save{color:var(--ok);font-weight:600}
.okbox{display:flex;gap:10px;align-items:flex-start;background:var(--ok-bg);border-radius:12px;padding:11px 12px;font-size:13px;font-weight:600;color:var(--ok)}
.okbox .ic{margin-top:2px}
.okbox span{color:var(--ink-2);font-weight:400;display:block;font-size:12px;margin-top:1px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:11px 12px;font-size:12.5px;color:var(--ink-2)}
.notice .ic{color:var(--accent);margin-top:2px}
.notice b{font-weight:600}

/* stat */
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-num);font-weight:600;font-size:38px;line-height:1.02;color:var(--ok);font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--f-ui);font-size:13px;font-weight:500;margin-left:3px}

/* products */
.prod{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.prod:last-child{border-bottom:0;padding-bottom:0}
.prod:first-child{padding-top:0}
.prod .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.prod .nm{font-weight:600;font-size:14.5px}
.prod .meta{font-size:11.5px;color:var(--faint)}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price .lbl{font-size:11px;color:var(--faint)}
.price .deal{font-family:var(--f-num);font-weight:600;font-size:23px;font-variant-numeric:tabular-nums}
.price .deal small{font-family:var(--f-ui);font-size:12px;font-weight:500;margin-left:2px}
.price .norm{font-size:12px;color:var(--faint);text-decoration:line-through;font-variant-numeric:tabular-nums}
.step{display:inline-grid;grid-template-columns:38px 44px 38px;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface-2);flex:none}
.step button{border:0;background:none;height:38px;font-size:19px;font-weight:500;color:var(--ink)}
.step output{text-align:center;font-family:var(--f-num);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
.step.sm{grid-template-columns:32px 36px 32px}
.step.sm button{height:32px;font-size:17px}
.step.sm output{font-size:17px}

/* list */
.list{display:flex;flex-direction:column}
.lr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.lr:last-child{border-bottom:0}
.lr.nodt{grid-template-columns:1fr auto}
.lr .dt{font-size:11.5px;color:var(--faint);min-width:58px;font-variant-numeric:tabular-nums}
.lr .t b{font-weight:500}
.lr .t small{display:flex;gap:6px;align-items:center;color:var(--faint);font-size:11px;margin-top:2px}
.lr .q{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* calendar */
.cal{display:flex;flex-direction:column;gap:8px}
.calh{display:flex;align-items:center;justify-content:space-between}
.calh b{font-size:15px;font-weight:600}
.calnav{display:flex;gap:4px}
.calnav button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.calnav .ic{width:14px;height:14px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cdow{font-size:10.5px;color:var(--faint);text-align:center;padding-bottom:2px}
.cdow.sun{color:var(--bad)}
.cday{position:relative;aspect-ratio:1/1.05;border:0;border-radius:9px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;gap:2px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:0}
.cday.out{visibility:hidden}
.cday.sun{color:var(--bad)}
.cday.hol{color:var(--bad)}
.cday.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cday[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cday .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:90%}
.cday .dots i{width:5px;height:5px;border-radius:50%}
.cday .cnt{font-family:var(--f-num);font-weight:600;font-size:12px;line-height:1}
.cday .ms{position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:2px;background:var(--accent)}
.cday.heat{color:var(--ink-2)}
.cday.heat[aria-pressed="true"]{color:var(--bg)}
.callg{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--sub)}
.callg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.callg i.sq{border-radius:2px}
.calday{border-top:1px solid var(--line-2);padding-top:8px}

/* map */
.mapwrap{position:relative;border-radius:14px;overflow:hidden;background:var(--mapbg)}
.mapwrap svg{width:100%;height:auto;display:block}
.gu{fill:var(--seq0);stroke:var(--mapbg);stroke-width:1.4;transition:fill .35s;vector-effect:non-scaling-stroke}
.mapwrap svg .route,.mapwrap svg .pc{vector-effect:non-scaling-stroke}
.gu.sel{fill:var(--accent-soft)}
.gu.c1{fill:var(--seq1)} .gu.c2{fill:var(--seq2)} .gu.c3{fill:var(--seq3)} .gu.c4{fill:var(--seq4)}
.gu.c1.sel,.gu.c2.sel,.gu.c3.sel,.gu.c4.sel{stroke:var(--ink);stroke-width:1.6}
.gul{font-family:var(--f-ui);font-weight:500;fill:var(--sub);pointer-events:none;text-anchor:middle}
.gul.dark{fill:var(--ink)}
.pin{cursor:pointer}
.pin .pc{fill:var(--accent);stroke:var(--surface);stroke-width:1.6}
.pin.me .pc{fill:var(--info)}
.pin .ph2{fill:transparent}
.pin.sel .pc{fill:var(--ink)}
.pin .pr{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.pin.sel .pr{animation:pinring 1.8s ease-out infinite}
@keyframes pinring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
.pin.drop{animation:drop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.odot{fill:var(--faint);opacity:.45}
.hq rect{fill:var(--ink)}
.hq text{font:600 9.5px var(--f-ui);fill:var(--ink)}
.route{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 5;animation:dash 1.2s linear infinite}
.route.done{stroke:var(--ok);animation:none;stroke-dasharray:none;opacity:.5}
@keyframes dash{to{stroke-dashoffset:-20}}
.truck circle{fill:var(--info);stroke:var(--surface);stroke-width:2;vector-effect:non-scaling-stroke}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.gchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--sub);display:inline-flex;gap:5px;align-items:center}
.gchip b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.gchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gchip[aria-pressed="true"] b{color:var(--bg)}
.gchip.off{opacity:.55}
.shopcard{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:13px;padding:10px 12px}
.shopcard .av{width:38px;height:38px;border-radius:11px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:15px}
.shopcard b{font-weight:600;font-size:14px}
.shopcard small{display:block;color:var(--faint);font-size:11.5px}
.picklist{display:flex;flex-direction:column}
.pickrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 2px;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;font-size:13px}
.pickrow:last-child{border-bottom:0}
.pickrow small{color:var(--faint);font-size:11.5px}
.pickrow[aria-pressed="true"]{color:var(--accent);font-weight:600}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:0 11px;background:var(--surface)}
.srch input{border:0;outline:0;background:none;padding:10px 0;font:inherit;color:var(--ink);width:100%}

/* compare */
.cmpc{border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:9px}
.cmpc.in{border-color:var(--ok-line)}
.cmpc .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cmpc .hd b{font-size:13.5px;font-weight:600}
.bal{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;font-size:11.5px}
.bal .lb{color:var(--sub)}
.bal .tr{height:12px;background:var(--surface-2);border-radius:0 5px 5px 0;display:flex}
.bal .sg{height:100%;transition:width .9s cubic-bezier(.2,.8,.25,1)}
.bal .sg + .sg{margin-left:2px}
.bal .sg.last{border-radius:0 4px 4px 0}
.bal .am{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;min-width:60px}
.netv{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:8px}
.netv .v{font-family:var(--f-num);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}
.netv .v.plus{color:var(--ok)} .netv .v.minus{color:var(--bad)}

/* timeline */
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:20px 1fr auto;gap:10px;position:relative;padding-bottom:14px}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;left:9px;top:20px;bottom:0;width:2px;background:var(--line)}
.tli:last-child::before{display:none}
.tli.done::before{background:var(--ok)}
.nd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;z-index:1}
.nd .ic{width:11px;height:11px;stroke-width:3}
.tli.done .nd{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tli.cur .nd{border-color:var(--accent);background:var(--accent-bg)}
.tli.cur .nd::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:tri 1.6s ease-in-out infinite}
.tli .tt{font-size:13px;font-weight:600}
.tli .tt small{display:block;font-weight:400;color:var(--faint);font-size:11.5px}
.tli .dd{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}

/* table */
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;min-width:320px}
table.t th{font-size:11px;color:var(--faint);font-weight:500;text-align:right;padding:6px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line-2);text-align:right;font-variant-numeric:tabular-nums}
table.t tfoot td{font-weight:600;border-bottom:0;border-top:1.5px solid var(--ink)}

/* rules */
.rules{display:flex;flex-direction:column;gap:11px;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.rules .n{width:28px;height:28px;border-radius:8px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:16px}
.rules b{display:block;font-size:13.5px;font-weight:600}
.rules span{font-size:12px;color:var(--sub)}

/* gauge bars (stock) */
.stk{display:flex;flex-direction:column;gap:10px}
.stkr{display:grid;grid-template-columns:86px 1fr 54px;gap:8px;align-items:center;font-size:12px}
.stkr .n{color:var(--ink-2)}
.stkr .tr{position:relative;height:8px;border-radius:4px;background:var(--surface-2)}
.stkr .f{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ok);transition:width .9s cubic-bezier(.2,.8,.25,1)}
.stkr .f.lo{background:var(--warn)}
.stkr .mk{position:absolute;top:-4px;bottom:-4px;border-left:1.5px dashed var(--accent)}
.stkr .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* range */
input[type=range]{width:100%;accent-color:var(--accent)}
.calcout{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calcout div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.calcout .k{font-size:11.5px;color:var(--sub)}
.calcout .v{font-family:var(--f-num);font-weight:600;font-size:23px;color:var(--ok);font-variant-numeric:tabular-nums}
.calcout .v small{font-family:var(--f-ui);font-size:11.5px;font-weight:500;margin-left:2px}

/* ring */
.ringrow{display:flex;align-items:center;gap:14px}
.ringrow svg{width:64px;height:64px;flex:none}
.ringrow .t b{display:block;font-size:14px;font-weight:600}
.ringrow .t span{font-size:12px;color:var(--sub)}
.rseg{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.25,1)}

/* intro */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.hero .top2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero .wm{font-family:var(--f-num);font-weight:600;font-size:30px;letter-spacing:.2em;line-height:1}
.hero .wm small{display:block;font-family:var(--f-ui);font-size:11.5px;letter-spacing:.02em;color:var(--hero-sub);font-weight:400;margin-top:7px}
.hero h1{margin:0;font-size:22px;line-height:1.38;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.hero p{margin:0;color:var(--hero-sub);font-size:13px;line-height:1.65}
.hero .net text{fill:var(--hero-ink)}
.hbadge{display:inline-flex;align-items:center;gap:6px;background:var(--hero-2);border-radius:999px;padding:4px 10px;font-size:11px;color:var(--hero-sub)}
.hbadge .pulse{--pc:#4CC38A}
.rolecards{display:flex;flex-direction:column;gap:8px}
.rolec{display:grid;grid-template-columns:38px 1fr 14px;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:12px}
.rolec .ri{width:38px;height:38px;border-radius:11px;background:var(--surface-2);color:var(--rc);display:grid;place-items:center}
.rolec .ri .ic{width:19px;height:19px}
.rolec b{display:block;font-size:14px;font-weight:600}
.rolec span{font-size:12px;color:var(--sub)}
.rolec .ch{color:var(--faint)}
.foot{font-size:11px;color:var(--faint);text-align:center;padding-top:2px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--faint);position:relative}
nav.tabs button .ic{width:20px;height:20px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:0 0 2px 2px;background:var(--accent)}

/* tour */
#tour{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:45;padding-inline:12px}
#tour .in{max-width:456px;margin:0 auto 8px;background:var(--hero);color:var(--hero-ink);border-radius:16px;padding:12px 12px 10px;box-shadow:var(--shadow-pop);display:flex;flex-direction:column;gap:8px}
#tour .tp{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--hero-sub);font-weight:500;letter-spacing:.04em}
#tour .bar{flex:1;height:3px;border-radius:2px;background:var(--hero-3);overflow:hidden;margin-left:6px}
#tour .bar i{display:block;height:100%;background:var(--hero-acc);transition:width .4s}
#tour .tx{font-size:13.5px;line-height:1.6}
#tour .tx b{color:var(--hero-acc);font-weight:600}
#tour .nav{display:flex;gap:8px;justify-content:flex-end}
#tour .nav button{border:0;border-radius:10px;padding:7px 14px;font-weight:600;font-size:13px}
#tour .nav .prev{background:var(--hero-3);color:var(--hero-ink)}
#tour .nav .next{background:var(--hero-acc);color:#1A1206}
#tour .nav .x{background:none;color:var(--hero-sub);margin-right:auto;padding-inline:4px;font-weight:500}
.spot{position:relative;z-index:1;box-shadow:0 0 0 2.5px var(--accent);animation:spot 1.8s ease-in-out infinite;border-radius:12px}
@keyframes spot{50%{box-shadow:0 0 0 6px var(--accent-line)}}

/* toast */
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:50;pointer-events:none;padding-inline:12px}
#toasts .in{max-width:456px;margin:0 auto;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{display:flex;align-items:center;gap:9px;background:var(--hero);color:var(--hero-ink);border-radius:999px;padding:7px 14px 7px 10px;font-size:12px;box-shadow:var(--shadow-pop);animation:tin .45s cubic-bezier(.2,1.2,.4,1) both;max-width:100%}
.toast.out{animation:tout .35s ease-in both}
.toast b{font-weight:600}
.toast .pulse{--pc:#4CC38A}
@keyframes tin{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* sheet */
#sheet{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#sheet .pane{width:100%;max-width:480px;max-height:90%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .32s cubic-bezier(.2,.8,.3,1)}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);align-self:center;margin-bottom:4px}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.shd{display:flex;align-items:center;gap:12px}
.shd b{font-size:16.5px;font-weight:600;display:block}
.seal{width:48px;height:48px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center;flex:none;animation:seal .5s cubic-bezier(.2,1.5,.4,1) both}
.seal .ic{width:24px;height:24px;stroke-width:2.6}
@keyframes seal{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px;margin:0}
.kv dt{color:var(--sub)} .kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.flowsteps{display:flex;flex-direction:column;gap:0;background:var(--surface-2);border-radius:13px;padding:10px 12px}
.fs{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:6px 0;font-size:12.5px;opacity:.35;transition:opacity .3s}
.fs.on{opacity:1}
.fs .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line)}
.fs.on .d{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.fs .d .ic{width:12px;height:12px;stroke-width:3}
.fs small{color:var(--faint);font-size:11px}
.paper{background:#FDFCF9;color:#1B1E22;border:1px solid #D9D5CB;border-radius:6px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;font-size:12px}
.paper h3{margin:0;font-size:17px;letter-spacing:.3em;text-align:center;font-weight:600}
.paper .pm{display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.paper .pm span{color:#5A6069}
.paper table{width:100%;border-collapse:collapse}
.paper th,.paper td{border:1px solid #CFCAC0;padding:5px 6px;text-align:right;font-variant-numeric:tabular-nums}
.paper th{background:#F1EEE7;font-weight:600;font-size:11px;color:#3D434B}
.paper th:first-child,.paper td:first-child{text-align:left}
.paper tfoot td{font-weight:600;background:#F7F4EE}
.paper .stampd{align-self:flex-end;border:2px solid #B0362C;color:#B0362C;border-radius:6px;padding:4px 8px;font-weight:600;font-size:11.5px;transform:rotate(-4deg)}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--sub)}
.form input,.form textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;color:var(--ink);background:var(--surface);width:100%}
.skuf{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface-2);border-radius:12px;padding:10px}
.skuf .full{grid-column:1/-1}
.switch{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.switch input{width:20px;height:20px;accent-color:var(--accent)}

[hidden]{display:none!important}
/* 단가 협의 보드 */
.badge{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;padding:0 4px;margin-left:2px}
.nsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.nsteps div{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--faint);min-width:0}
.nsteps i{height:4px;border-radius:2px;background:var(--line)}
.nsteps .done{color:var(--ink-2)} .nsteps .done i{background:var(--ok)}
.nsteps .cur{color:var(--ink);font-weight:600} .nsteps .cur i{background:var(--accent);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
table.t.tier{min-width:0}
table.t.tier th{vertical-align:bottom;line-height:1.3;padding:6px 4px} table.t.tier th small{display:block;font-size:10.5px;color:var(--faint);font-weight:400}
table.t.tier th b{font-weight:600;color:var(--sub)}
table.t.tier td{padding:9px 4px} table.t.tier td:first-child{word-break:keep-all;padding-right:6px}
table.t.tier th .was{display:block;margin:0}
.was{text-decoration:line-through;color:var(--faint);font-weight:400;margin-right:4px}

function spark(vals,labels,color){
  var W=320,H=78,P=8,max=Math.max.apply(null,vals)*1.18;
  var xs=function(i){return P+i*(W-2*P-44)/(vals.length-1);};
  var ys=function(v){return H-P-(v/max)*(H-2*P);};
  var pts=vals.map(function(v,i){return xs(i)+','+ys(v);});
  var area='M'+xs(0)+','+(H-P)+'L'+pts.join('L')+'L'+xs(vals.length-1)+','+(H-P)+'Z';
  var len=0;for(var i=1;i<vals.length;i++){len+=Math.hypot(xs(i)-xs(i-1),ys(vals[i])-ys(vals[i-1]));}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="월별 절감액 추이">';
  s+='<line class="base" x1="'+P+'" x2="'+(W-P-44)+'" y1="'+(H-P)+'" y2="'+(H-P)+'"/><path d="'+area+'" fill="var(--ok-bg)"/>';
  s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+(color||'var(--ok)')+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" '+(ANIM?'style="stroke-dasharray:'+len+';stroke-dashoffset:'+len+';animation:draw 1.1s .15s cubic-bezier(.3,.7,.3,1) forwards"':'')+'/>';
  vals.forEach(function(v,i){var last=i===vals.length-1;s+='<circle cx="'+xs(i)+'" cy="'+ys(v)+'" r="'+(last?4.5:9)+'" fill="'+(last?(color||'var(--ok)'):'transparent')+'" '+(last?'stroke="var(--surface)" stroke-width="2"':'')+' data-tip="'+labels[i]+' '+won(v)+'원"/>';});
  var lx=xs(vals.length-1),ly=ys(vals[vals.length-1]);
  s+='<text x="'+(lx+8)+'" y="'+(ly+4)+'" style="font:600 13px var(--f-num);fill:'+(color||'var(--ok)')+'">'+man(vals[vals.length-1])+'만</text>';

}

function ordersOn(m,d,filterShop){
  var src=m===9?SEP:OCT;
  return src.filter(function(o){return o.m===m&&o.d===d&&(!filterShop||o.shop===filterShop);});
}
function scheduledOn(m,d,filterShop){
  if(m!==10)return [];
  return SHOPS.filter(function(s){return s.stand&&s.stand===d&&d>TODAY.d&&(!filterShop||s.id===filterShop);});
}
var MILE={'9-30':'9월 마감','10-1':'월 거래내역 승인 요청','10-5':'총판 정산서 제출','10-12':'총판·대리점 간 정산'};
function calendar(mode){
  var st=S.cal[mode],m=st.m,first=dowOf(m,1),n=daysIn(m),sel=st.d;
  var heat={},hmax=1;
  if(mode!=='shop'){for(var d0=1;d0<=n;d0++){var t=0;ordersOn(m,d0).forEach(function(o){t+=sum(o.q);});heat[d0]=t;if(t>hmax)hmax=t;}}
  var h='<div class="cal"><div class="calh"><b>2026년 '+m+'월</b><div class="calnav"><button data-act="calm" data-mode="'+mode+'" data-m="9" aria-label="9월" '+(m===9?'disabled':'')+'>'+ic('chevl')+'</button><button data-act="calm" data-mode="'+mode+'" data-m="10" aria-label="10월" '+(m===10?'disabled':'')+'>'+ic('chev')+'</button></div></div><div class="cgrid">';
  DOW.forEach(function(w,i){h+='<div class="cdow'+(i===0?' sun':'')+'">'+w+'</div>';});
  for(var b=0;b<first;b++){h+='<div class="cday out"></div>';}
  for(var d=1;d<=n;d++){
    var dw=dowOf(m,d),cls='cday',inner='<span>'+d+'</span>',style='',tip='';
    if(dw===0)cls+=' sun';if(HOL[m+'-'+d]){cls+=' hol';tip=HOL[m+'-'+d];}

      if(os.length||sc.length){inner+='<span class="dots">'+os.map(function(o){return '<i style="background:'+CH[o.ch].c+'"></i>';}).join('')+sc.map(function(){return '<i style="background:none;box-shadow:inset 0 0 0 1.5px var(--ok)"></i>';}).join('')+'</span>';}
    } else {
      var v=heat[d]||0,lvl=v?Math.min(4,1+Math.floor(v/hmax*3.99)):0;

  else if(mode==='dealer')h+='<div class="callg"><span>숫자 = 그날 들어온 발주(통)</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--ok)"></i>정기 발주 예정</span></div>';

/* ---------- 대구 지도 ---------- */
function fitVB(pts,pad){
  var W=MAP.W,H=MAP.H,R=W/H,x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pts.forEach(function(p){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});
  var w=Math.max(x1-x0,W/3.4),h=Math.max(y1-y0,H/3.4);w*=1+pad;h*=1+pad;
  if(w/h>R)h=w/R;else w=h*R;
  var cx=(x0+x1)/2,cy=(y0+y1)/2;return [cx-w/2,cy-h/2,w,h];
}

var VBP={};
function zoomMaps(){
  Array.prototype.forEach.call(view.querySelectorAll('svg[data-key]'),function(svg){
    var key=svg.getAttribute('data-key');if(!key)return;var to=svg.getAttribute('viewBox').split(' ').map(Number),from=VBP[key];VBP[key]=to;
    if(!from||REDUCED||from.join()===to.join())return;var t0=null,dur=520;svg.setAttribute('viewBox',from.join(' '));
    function st(ts){if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/dur),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;svg.setAttribute('viewBox',from.map(function(v,i){return (v+(to[i]-v)*e).toFixed(2);}).join(' '));if(p<1)requestAnimationFrame(st);}
    requestAnimationFrame(st);
  });
}
function settle(){
  Array.prototype.forEach.call(view.querySelectorAll('[data-to]'),function(el){el.setAttribute('stroke-dasharray',el.getAttribute('data-to'));});
  Array.prototype.forEach.call(view.querySelectorAll('[data-w]'),function(el){el.style.width=el.getAttribute('data-w')+'%';});
}
function countUp(){
  var els=view.querySelectorAll('[data-count]');
  Array.prototype.forEach.call(els,function(el){
    var to=+el.getAttribute('data-count'),f=el.getAttribute('data-fmt'),t0=null,dur=900;
    el.textContent=fmtv(0,f);
    function step(ts){if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmtv(f==='d1'?to*e:Math.round(to*e),f);if(p<1)requestAnimationFrame(step);else el.textContent=fmtv(to,f);}
    requestAnimationFrame(step);
  });
}

  function(){var s=pick(['sg','do','cb','hm']);var q=[1+(S.simN%3),S.simN%2,0];addOrder(s,q,'dl');return {r:'dealer',a:CFG.dealer,b:'대리 발주 등록',c:shopById(s).name+' · '+sum(q)+'통',order:true};},
  function(){var s=pick(['sb','ie','hg']);var q=[2,1,0];addOrder(s,q,'me');return {r:'shop',a:shopById(s).name,b:'발주',c:sum(q)+'통 · 협정가 적용',order:true};},
  function(){return {r:'dealer',a:CFG.dealer,b:'납품 완료',c:pick(['바른정비','누리모터스'])+' · 오후 배송',order:false};},
  function(){return {r:'coop',a:'협동조합',b:'공지 발송',c:'11월 부동액 공동구매 수요 조사',order:false};}
];
function pick(a){return a[(S.simN+a.length)%a.length];}
function simTick(){
  if(!CFG.sim||document.hidden||!sheet.hidden||S.simN>=14)return;
  var e=SIM[S.simN%SIM.length]();S.simN++;e.t=nowT();e.a=esc(e.a);e.fresh=true;
  S.feed.forEach(function(x){x.fresh=false;});S.feed.unshift(e);S.feed=S.feed.slice(0,30);
  toast('<span class="pulse"></span><span><b>'+e.a+'</b> '+e.b+' · '+esc(e.c)+'</span>');
  var n=view.querySelector('[data-live="octN"]'),t=view.querySelector('[data-live="octT"]');if(n)n.textContent=OCT.length;if(t)t.textContent=octTong();
  var fl=document.getElementById('feedlist');if(fl){fl.innerHTML=S.feed.slice(0,5).map(feedRow).join('');}
}
function toast(h){var el=document.createElement('div');el.className='toast';el.innerHTML=h;toasts.appendChild(el);while(toasts.children.length>2)toasts.removeChild(toasts.firstChild);setTimeout(function(){el.classList.add('out');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},400);},3600);}

/* ================= 이벤트 ================= */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-role],[data-tab],[data-go]');if(!el)return;
  if(el.hasAttribute('data-role')){S.role=el.getAttribute('data-role');S.tour=null;render();return;}
  if(el.hasAttribute('data-go')){S.role=el.getAttribute('data-go');render();return;}
  if(el.hasAttribute('data-tab')){S.scr[S.role]=el.getAttribute('data-tab');S.tour=null;render();return;}
  var a=el.getAttribute('data-act'),i=+el.getAttribute('data-i');
  switch(a){
    case 'intro':S.role=null;S.tour=null;closeSheet();render();break;
    case 'tour-start':goTour(0);break;
    case 'tour-next':if(S.tour===TOUR.length-1){S.tour=null;S.role=null;closeSheet();render();}else goTour(S.tour+1);break;
    case 'tour-prev':goTour(Math.max(0,S.tour-1));break;
    case 'tour-end':S.tour=null;view.querySelectorAll('.spot').forEach(function(x){x.classList.remove('spot');});renderTour();break;
    case 'theme':setTheme(curTheme()==='dark'?'light':'dark');render(true);toast('<span>'+(curTheme()==='dark'?'다크':'라이트')+' 모드로 바꿨습니다</span>');break;
    case 'live':liveSheet();break;
    case 'settings':settingsSheet();break;
    case 'cfg-reset':CFG=JSON.parse(JSON.stringify(DEF));try{localStorage.removeItem(STORE_KEY);}catch(x){}closeSheet();seedFeed();render();break;
    case 'standing':if(!S.standingDone){S.standingDone=true;S.cart=[16,7,3];var no=addOrder('hs',S.cart,'st');render(true);
      flowSheet('10월 정기 발주 확정','주문번호 '+no,[['수량','26통 · 520L'],['협정가 합계',won(dealT(S.cart))+'원'],['시중 매입가 대비','<span class="save">−'+won(saveT(S.cart))+'원</span>'],['납품','10/5(월) 오전 · '+esc(CFG.dealer)]],orderFlow('해솔모터스'));}break;
    case 'to-order':S.cart=[16,7,3];S.scr.shop='order';render();break;
    case 'cart+':S.cart[i]++;render(true);break;
    case 'cart-':if(S.cart[i]>0)S.cart[i]--;render(true);break;
    case 'order':if(sum(S.cart)){var q=S.cart.slice(),no2=addOrder('hs',q,'me');
      flowSheet('발주가 원장에 기록되었습니다','주문번호 '+no2,[['수량',sum(q)+'통 · '+sum(q)*L_PER+'L'],['협정가 합계',won(dealT(q))+'원'],['시중 매입가 대비','<span class="save">−'+won(saveT(q))+'원</span>'],['납품','다음 영업일 오전 · '+esc(CFG.dealer)]],orderFlow('해솔모터스'),'<button class="tbtn" data-act="see-coop">협동조합 화면에서 확인 '+ic('chev')+'</button>');render(true);}break;
    case 'sep-ok':if(!S.sepOk){S.sepOk=true;S.dispute=false;render(true);
      flowSheet('9월 거래내역 승인','10/2(금) '+nowT(),[['승인 내역','11건 · 26통'],['협정가 합계',won(dealT([16,7,3]))+'원'],['협동조합 승인 현황','12/12곳']],[['회원사 승인','해솔모터스',nowT()],['정산 대상 확정','9월분','즉시'],['정산서 제출 대기','10/5(월)','예정']]);}break;
    case 'dispute':openSheet('<b style="font-size:16px;font-weight:600">이의 신청</b><p class="lead">해당 발주를 선택하고 사유를 적으면 대리점과 협동조합에 동시에 전달됩니다. 확인 전까지 그 건은 정산에서 제외됩니다.</p><form class="form" id="dispform"><label>대상 발주<input value="9/28(월) · 5W-30 C3 1통 · 대리 발주" readonly></label><label>사유<textarea id="dispwhy" rows="2" placeholder="예: 수량 상이"></textarea></label><button class="btn dark block" type="submit">이의 신청 접수</button></form><p class="hint">시연 화면입니다.</p>');break;
    case 'lview':S.ledgerView=el.getAttribute('data-v');render(true);break;
    case 'calm':S.cal[el.getAttribute('data-mode')].m=+el.getAttribute('data-m');S.cal[el.getAttribute('data-mode')].d=null;render(true);break;
    case 'calday':S.cal[el.getAttribute('data-mode')].d=+el.getAttribute('data-d');render(true);break;
    case 'dfind':S.dFind=el.getAttribute('data-v');render(true);break;
    case 'gu':if(S.role==='dealer'){var g=el.getAttribute('data-gu');S.dGu=S.dGu===g?null:g;render(true);}else if(S.role==='coop'){var g2=el.getAttribute('data-gu');S.cGu=S.cGu===g2?null:g2;render(true);}break;
    case 'cgu':var g3=el.getAttribute('data-gu');S.cGu=S.cGu===g3?null:g3;render(true);break;
    case 'pin':if(S.role==='dealer'){var sh=shopById(el.getAttribute('data-id'));S.dShop=sh.id;S.dGu=sh.gu;render(true);}else if(S.role==='coop'){S.cGu=shopById(el.getAttribute('data-id')).gu;render(true);}break;
    case 'dq+':S.dQty[i]++;render(true);break;
    case 'dq-':if(S.dQty[i]>0)S.dQty[i]--;render(true);break;
    case 'dsubmit':if(sum(S.dQty)&&S.dShop){var dq=S.dQty.slice(),s2=shopById(S.dShop),no3=addOrder(S.dShop,dq,'dl');
      S.feed.forEach(function(x){x.fresh=false;});S.feed.unshift({r:'dealer',a:esc(CFG.dealer),b:'대리 발주 등록',c:s2.name+' · '+sum(dq)+'통',t:nowT(),fresh:true});
      flowSheet('대리 발주 등록 완료','주문번호 '+no3,[['회원사',s2.name+' ('+s2.gu+')'],['수량',sum(dq)+'통 · '+qtxt(dq)],['협정가','적용'],['단가 보전 예정','<span class="save">+'+won(keepT(dq))+'원</span>']],[['대리 발주 등록',CFG.dealer+' '+CFG.dealerPerson,nowT()],['원장 기록','협정가 적용','즉시'],['회원사 알림',s2.name+' 원장에 표시','즉시'],['협동조합 집계','10월 물량 반영','즉시']]);
      S.dQty=[1,1,0];render(true);}break;
    case 'paper':paperSheet();break;
    case 'cset':S.cset=el.getAttribute('data-v');render(true);break;
    case 'neg-counter':negCounterSheet();break;
    case 'neg-accept':negAccept();break;
    case 'neg-memo':openSheet('<b style="font-size:16px;font-weight:600">메모 남기기</b><p class="lead">'+(S.role==='dealer'?'협동조합 임원':esc(CFG.dealer))+'에게만 전달됩니다. 회원사에는 보이지 않습니다.</p><form class="form" id="memoform"><label>내용<textarea id="memotx" rows="3" placeholder="예: 동절기 수요 반영 부탁드립니다"></textarea></label><button class="btn dark block" type="submit">남기기</button></form>');break;
    case 'neg-new':negNewSheet();break;
    case 'join':S.joined=true;render(true);break;
    case 'close':closeSheet();break;
    case 'see-coop':closeSheet();S.role='coop';S.scr.coop='dash';S.tour=null;render();break;
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id==='cfgform'){e.preventDefault();var v=function(id){return document.getElementById(id).value.trim();},nn=function(id,d){var x=parseInt(v(id).replace(/[^0-9]/g,''),10);return isNaN(x)?d:x;};
    CFG.coop=v('c_coop')||DEF.coop;CFG.dealer=v('c_dealer')||DEF.dealer;CFG.dealerPerson=v('c_person')||DEF.dealerPerson;CFG.supplier=v('c_sup')||DEF.supplier;CFG.thresh=Math.max(1,nn('c_th',10));CFG.sim=document.getElementById('c_sim').checked;
    for(var k=0;k<3;k++){var s=CFG.sku[k];s.name=v('s'+k+'n')||s.name;s.note=v('s'+k+'o')||s.note;s.normal=nn('s'+k+'m',s.normal);s.deal=nn('s'+k+'d',s.deal);s.buy=nn('s'+k+'b',s.buy);s.keep=nn('s'+k+'k',s.keep);}
    saveCfg();closeSheet();seedFeed();render();toast('<span>시연 설정을 적용했습니다</span>');}
  if(e.target.id==='negform'){e.preventDefault();var t2=numv('ng2',4500),t3=Math.max(numv('ng3',6500),t2+500),mx=document.getElementById('ngmemo').value.trim();
    NEG.cth=[0,t2,t3];NEG.status='countered';NEG.thread.push({by:'coop',t:'10/2(금) '+nowT(),x:esc(mx||'원장 기준 최근 3개월 물량을 반영해 구간 기준을 조정합니다.')});
    closeSheet();render(true);toast('<span><b>역제안 전송</b> · '+esc(CFG.dealer)+'에만 전달</span>');}
  if(e.target.id==='memoform'){e.preventDefault();var tx=document.getElementById('memotx').value.trim();if(!tx){closeSheet();return;}
    NEG.thread.push({by:S.role==='dealer'?'dealer':'coop',t:'10/2(금) '+nowT(),x:esc(tx)});closeSheet();render(true);toast('<span>메모를 남겼습니다 · 상대방에게 알림</span>');}
  if(e.target.id==='negnew'){e.preventDefault();var n2=numv('nn2',5000),n3=Math.max(numv('nn3',7000),n2+500),fresh=NEG.status==='agreed';
    for(var k2=0;k2<3;k2++){var d=SKU(k2).deal,p1=numv('np'+k2+'1',negPrice(k2,1)),p2=numv('np'+k2+'2',negPrice(k2,2));NEG_OFF[k2]=[0,Math.max(0,d-p1),Math.max(0,d-Math.min(p1,p2))];}
    if(fresh){NEG.no='PR-2612-01';NEG.title='12월 구간 협정가';NEG.eff='12/1(화)';NEG.thread=[];}else{NEG.no=NEG.no.replace(/-(\d+)$/,function(m,x){return '-'+String(+x+1).padStart(2,'0');});}
    NEG.th=[0,n2,n3];NEG.cth=null;NEG.agreeNo=null;NEG.status='proposed';
    NEG.thread.push({by:'dealer',t:'10/2(금) '+nowT(),x:esc(document.getElementById('nnmemo').value.trim()||(fresh?'총판 12월 정책 기준으로 구간 협정가를 제안드립니다.':'구간 기준과 단가를 수정해 다시 제안드립니다.'))});
    closeSheet();render(true);toast('<span><b>단가 제안 전송</b> · 협동조합 임원에게만 전달</span>');}
  if(e.target.id==='dispform'){e.preventDefault();S.dispute=true;closeSheet();render(true);toast('<span><b>이의 신청 접수</b> · 대리점·협동조합에 전달</span>');}
});
document.addEventListener('input',function(e){
  if(e.target.id==='calc'){var q=S.calc=+e.target.value,m=q*avgSaveMix();document.getElementById('calcQ').textContent=q+'통 · '+q*L_PER+'L';document.getElementById('calcM').textContent=man(m);document.getElementById('calcY').textContent=man(m*12);document.getElementById('calcH').innerHTML=calcPass(q);}
  if(e.target.id==='shopq'){S.q=e.target.value;var ql=S.q.trim(),res=SHOPS.filter(function(s){return !ql||s.name.indexOf(ql)>=0||s.gu.indexOf(ql)>=0;});var r=document.getElementById('shopres');if(r)r.innerHTML=shopRows(res);}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)closeSheet();});

/* 단가 협의 시트 */
function numv(id,d){var el=document.getElementById(id);if(!el)return d;var x=parseInt(String(el.value).replace(/[^0-9]/g,''),10);return isNaN(x)?d:x;}
function negCounterSheet(){
  openSheet('<b style="font-size:16px;font-weight:600">원장 근거로 역제안</b><p class="lead">구간 기준을 조정해 대리점에 돌려보냅니다. 단가는 대리점 제안 그대로 두고, 기준 물량만 바꿉니다.</p>'+evidBox()+
    '<form class="form" id="negform"><div class="skuf"><label>2구간 기준 (L 이상)<input id="ng2" type="number" inputmode="numeric" value="4500"></label><label>3구간 기준 (L 이상)<input id="ng3" type="number" inputmode="numeric" value="6500"></label></div>'+
    '<label>메모<textarea id="ngmemo" rows="2">정기 발주 확정 물량과 10월 추세를 보면 2구간은 4,500L가 적정합니다.</textarea></label><button class="btn dark block" type="submit">역제안 보내기</button></form>');
}
function negNewSheet(){
  var fresh=NEG.status==='agreed',ps=[0,1,2].map(function(k){return '<div class="skuf"><span class="full" style="font-weight:600;font-size:12.5px">'+SKU(k).name+' <span class="hint">· 현재 협정가 '+won(SKU(k).deal)+'원</span></span><label>2구간 협정가<input id="np'+k+'1" type="number" inputmode="numeric" value="'+negPrice(k,1)+'"></label><label>3구간 협정가<input id="np'+k+'2" type="number" inputmode="numeric" value="'+negPrice(k,2)+'"></label></div>';}).join('');
  openSheet('<b style="font-size:16px;font-weight:600">'+(fresh?'새 단가 제안 · 12월':'제안 수정 · '+NEG.title)+'</b><p class="lead">협동조합 임원에게만 전달됩니다. 원장 근거는 CARTOS가 자동으로 첨부합니다.</p>'+
    '<form class="form" id="negnew"><div class="skuf"><label>2구간 기준 (L 이상)<input id="nn2" type="number" inputmode="numeric" value="'+NEG.th[1]+'"></label><label>3구간 기준 (L 이상)<input id="nn3" type="number" inputmode="numeric" value="'+NEG.th[2]+'"></label></div>'+ps+
    '<label>메모<textarea id="nnmemo" rows="2" placeholder="예: 총판 정책 변경 사항"></textarea></label><button class="btn dark block" type="submit">제안 보내기</button></form>');
}
function negAccept(){
  if(NEG.status==='agreed')return;
  var th=negTh();NEG.status='agreed';NEG.agreeNo=NEG.no.replace('PR','AG');
  NEG.thread.push({by:'sys',t:'10/2(금) '+nowT(),x:'양측 합의 · '+NEG.agreeNo+' · '+NEG.eff+' 시행 예약'});
  render(true);
  flowSheet('단가 합의 완료','합의 번호 '+NEG.agreeNo,[['구간 기준','2구간 '+won(th[1])+'L · 3구간 '+won(th[2])+'L'],['시행',NEG.eff+' 발주분부터'],['회원사 공지','확정 협정가만']],
    [['양측 확정',esc(CFG.dealer)+' · 협동조합',nowT()],['시행 예약',NEG.eff,'자동'],['사장님 발주 화면 반영','구간 도달 시 자동','예정'],['회원사 공지','확정 협정가만','예정']]);
}

/* 툴팁 */
function showTip(el,x,y){tip.textContent=el.getAttribute('data-tip');tip.hidden=false;var w=tip.offsetWidth,h=tip.offsetHeight,l=Math.max(8,Math.min(innerWidth-w-8,x-w/2)),t=y-h-12;if(t<8)t=y+16;tip.style.left=l+'px';tip.style.top=t+'px';}
function hideTip(){tip.hidden=true;}
document.addEventListener('pointermove',function(e){if(e.pointerType!=='mouse')return;var t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(t,e.clientX,e.clientY);else hideTip();});
document.addEventListener('pointerdown',function(e){var t=e.target.closest&&e.target.closest('[data-tip]');if(t&&e.pointerType!=='mouse'){showTip(t,e.clientX,e.clientY);clearTimeout(showTip._t);showTip._t=setTimeout(hideTip,1800);}else if(!t)hideTip();});
window.addEventListener('scroll',hideTip,{passive:true});

/* 화면 테마 (라이트/다크 · 이 기기에 저장) */
var THEME_KEY='cartos_theme';
function sysDark(){try{return window.matchMedia('(prefers-color-scheme: dark)').matches;}catch(e){return false;}}
function curTheme(){var a=document.documentElement.getAttribute('data-theme');return a==='dark'||a==='light'?a:(sysDark()?'dark':'light');}
function paintTheme(){
  var t=curTheme(),b=document.getElementById('thm');
  if(b){b.innerHTML=ic(t==='dark'?'sun':'moon');b.setAttribute('aria-label',t==='dark'?'라이트 모드로 보기':'다크 모드로 보기');b.title=t==='dark'?'라이트 모드':'다크 모드';}
  var m=document.querySelector('meta[name="theme-color"]');if(!m){m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m);}
  m.content=t==='dark'?'#0D1013':'#EDEFF2';
}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem(THEME_KEY,t);}catch(e){}paintTheme();}
(function(){var t=null;try{t=localStorage.getItem(THEME_KEY);}catch(e){}if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);paintTheme();
  try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);}catch(e){}})();

/* 시작 */
seedFeed();
var hsh=(location.hash||'').replace('#','');
if(hsh==='shop'||hsh==='dealer'||hsh==='coop')S.role=hsh;
render();
if(hsh==='tour')goTour(0);
setInterval(simTick,11000);
})();

</script>
